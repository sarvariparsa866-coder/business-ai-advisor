name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o BusinessAIAdvisor_Android_MVP.zip

      - name: Fix Java and Kotlin settings
        working-directory: BusinessAIAdvisor_Android
        run: |
          python3 - <<'PY'
          p = "app/build.gradle.kts"
          s = open(p).read()
          s = s.replace(
              '    targetSdk = 35\n',
              '    targetSdk = 35\n'
              '    compileOptions {\n'
              '        sourceCompatibility = JavaVersion.VERSION_17\n'
              '        targetCompatibility = JavaVersion.VERSION_17\n'
              '    }\n'
              '    kotlinOptions {\n'
              '        jvmTarget = "17"\n'
              '    }\n'
          )
          open(p, "w").write(s)
          PY

      - name: Build APK
        working-directory: BusinessAIAdvisor_Android
        run: gradle assembleDebug --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: BusinessAIAdvisor-APK
          path: BusinessAIAdvisor_Android/app/build/outputs/apk/debug/app-debug.apk
